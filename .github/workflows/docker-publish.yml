name: Publish Docker Image

on:
  release:
    types: [published]  # Only runs on GitHub releases

env:
  IMAGE_NAME: mikedmor/arcadescore  # Replace with your actual Docker Hub repo

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine Docker Tags
        id: set_tags
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          IS_PRERELEASE="${{ github.event.release.prerelease }}"

          # Releases are tagged with a plain build number (see BUILD_NUMBER at the repo
          # root / app/modules/updater.py) - fail loudly rather than silently pushing an
          # untagged image if a release doesn't follow that scheme.
          if ! [[ "$TAG_NAME" =~ ^[0-9]+$ ]]; then
            echo "::error::Release tag '$TAG_NAME' isn't a plain build number - expected e.g. '42'."
            exit 1
          fi

          # Whether "latest" also gets updated is GitHub's own "Set as a pre-release"
          # checkbox on the release (IS_PRERELEASE), not anything inferred from the tag.
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            echo "TAGS=${{ env.IMAGE_NAME }}:${TAG_NAME}" >> $GITHUB_ENV
          else
            echo "TAGS=${{ env.IMAGE_NAME }}:${TAG_NAME},${{ env.IMAGE_NAME }}:latest" >> $GITHUB_ENV
          fi

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Build and Push Docker Image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.TAGS }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate Artifact Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
